name: Security Reports

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-reports:
    runs-on: ubuntu-latest
    env:
      SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Prepare report directory
        if: always()
        run: mkdir -p reports/dependency-check

      - name: Bandit
        if: always()
        shell: bash
        run: bandit -r app -f html -o reports/bandit.html

      - name: Safety
        if: ${{ always() && env.SAFETY_API_KEY != '' }}
        shell: bash
        run: safety --stage production scan --target . --save-as html reports/safety.html

      - name: Snyk
        if: ${{ always() && env.SNYK_TOKEN != '' }} 
        shell: bash
        run: |
          npm install --global snyk snyk-to-html
          snyk test --file=requirements.txt --package-manager=pip --json > /tmp/snyk-report.json
          snyk-to-html -i /tmp/snyk-report.json -o reports/snyk.html

      - name: OWASP Dependency-Check
        if: always()
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: secure-data-api
          path: .
          format: HTML
          out: reports/dependency-check
          args: >
            --failOnCVSS 1
            ${{ secrets.NVD_API_KEY != '' && format('--nvdApiKey {0}', secrets.NVD_API_KEY) || '' }}

      - name: Upload HTML security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-html
          path: reports/**/*.html
          if-no-files-found: error
          retention-days: 14
