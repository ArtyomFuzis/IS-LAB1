name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Prepare reports
        if: always()
        run: mkdir -p reports

      - name: Bandit
        if: always()
        run: bandit -r app -f json -o reports/bandit.json

      - name: Safety
        if: ${{ always() && env.SAFETY_API_KEY != '' }}
        run: safety --stage production scan --target . --save-as json reports/safety.json

      - name: Snyk
        if: ${{ always() && env.SNYK_TOKEN != '' }}
        uses: snyk/actions/python@master
        with:
          args: --file=requirements.txt --package-manager=pip --json-file-output=reports/snyk.json

      - name: OWASP Dependency-Check
        if: always()
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: secure-data-api
          path: .
          format: ALL
          out: reports/dependency-check
          args: >
            --enableExperimental
            --failOnCVSS 7
            ${{ secrets.NVD_API_KEY != '' && format('--nvdApiKey {0}', secrets.NVD_API_KEY) || '' }}

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn
